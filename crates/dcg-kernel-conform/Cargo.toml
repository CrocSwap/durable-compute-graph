[package]
name = "dcg-kernel-conform"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Conformance server for the DCG example kernels (kernel kit, alpha plan E2/C3)."

# Not a default workspace member: its features (test kernels, no-entrypoint)
# would unify into the other crates under `cargo test --workspace`.
#
# An application copies this crate, names its own kernels in main.rs, and
# drives the binary with `python -m dcg.kernel_kit check`.
[dependencies]
dcg-program = { path = "../dcg-program", features = ["no-entrypoint", "graph-v21", "example-kernels", "sbf-real-lifecycle-test"] }
# The same-source SBF reference (src/bin/dcg-kernel-conform-sbf.rs); the
# versions pinned by dcg-program's ProgramTests.
solana-account = "=2.2.1"
solana-compute-budget-interface = "=2.2.2"
solana-instruction = "=2.3.3"
solana-program-test = "=2.3.9"
solana-pubkey = "=2.4.0"
solana-signer = "=2.2.1"
solana-transaction = "=2.2.3"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] }
