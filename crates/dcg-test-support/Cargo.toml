[package]
name = "dcg-test-support"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Real-flow state builder for DCG program tests: protocol states are reached by real instructions, never by hand-built account bytes"

[dependencies]
dcg-program = { path = "../dcg-program", default-features = false, features = ["revision-8"] }
serde_json = "=1.0.151"
solana-account = "=2.2.1"
solana-compute-budget-interface = "=2.2.2"
solana-hash = "=2.3.0"
solana-instruction = "=2.3.3"
solana-keypair = "=2.2.3"
solana-program = "=2.3.0"
solana-program-test = "=2.3.9"
solana-pubkey = "=2.4.0"
solana-signer = "=2.2.1"
solana-transaction = "=2.2.3"
solana-transaction-error = "=2.2.1"
