[package]
name = "tpu-sender"
version = "0.1.0"
edition = "2021"
publish = false
description = "stdin -> TPU QUIC pump: streams pre-signed Solana wire transactions to current/upcoming leaders"

# Standalone crate on purpose: not a member of chain/program's workspace.
[workspace]

[[bin]]
name = "tpu-sender"
path = "src/main.rs"

[dependencies]
# Pinned to the 2.3.13 graph that is already in the local cargo registry cache.
solana-client = "=2.3.13"
solana-rpc-client = "=2.3.13"
solana-quic-client = "=2.3.13"
solana-connection-cache = "=2.3.13"
solana-commitment-config = "=2.2.1"

bs58 = "0.5"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std", "io-util"] }

[profile.release]
opt-level = 3
debug = false
